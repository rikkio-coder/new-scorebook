<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221C2B">
<title>オープン戦 成績管理</title>
<style>
:root{
  --paper:#EFEFF2;
  --card:#FFFFFF;
  --ink:#191521;
  --ink-2:#4A4455;
  --muted:#7B7486;
  --line:#E3E1E8;
  --line-2:#F0EFF3;
  --accent:#6B3FA0;
  --accent-deep:#3F2263;
  --accent-soft:#F1EBF8;
  --good:#1C7C55;
  --good-soft:#E6F3ED;
  --warn:#B4441E;
  --warn-soft:#FBECE6;
  --font-ui:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --shadow:0 1px 2px rgba(25,21,33,.06),0 8px 24px rgba(25,21,33,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;line-height:1.55;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--accent-deep);
  color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:baseline;gap:10px;
}
.top h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
.top .eyebrow{
  font-family:var(--font-num);font-size:10px;letter-spacing:.12em;
  color:#C6ADE4;margin-left:auto;white-space:nowrap;
}
.top .eyebrow.ok{color:#9FE3C0}
.top .eyebrow.err{color:#FFB4A0}
.viewbar{
  background:var(--accent-soft);color:var(--accent-deep);border-radius:11px;
  padding:10px 13px;margin-bottom:12px;font-size:12.5px;display:flex;align-items:center;gap:10px;
}
.viewbar b{font-weight:600}
main{padding:14px 14px 28px;max-width:720px;margin:0 auto}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-pad{padding:14px}
.sec-label{
  font-family:var(--font-num);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.btn{
  background:var(--accent);color:#fff;border-radius:10px;padding:11px 16px;
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 13px;font-size:13px;color:var(--ink-2);white-space:nowrap;
}
.chip.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;font-weight:600}
.scroll-x{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
label.field{display:block;margin-bottom:12px}
label.field > span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;
}
textarea{min-height:110px;font-family:var(--font-num);font-size:12px}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:13.5px}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;font-weight:600}
.badge{
  font-family:var(--font-num);font-size:10px;letter-spacing:.08em;padding:3px 7px;border-radius:5px;
  background:var(--line-2);color:var(--muted);
}
.badge.ok{background:var(--good-soft);color:var(--good)}
.res{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:var(--line-2);color:var(--muted);letter-spacing:.04em;
}
.res.win{background:#E4F2E9;color:#14653C}
.res.lose{background:#FBE7E2;color:#9C3A20}
.res.draw{background:#EEECF2;color:#5A5266}
.badge.tmA{background:var(--accent-deep);color:#fff;letter-spacing:.02em}
.badge.tmB{background:#DCD8E4;color:var(--accent-deep);letter-spacing:.02em}

/* ---------- signature: stat gauges ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line-2)}
.stat{background:#fff;padding:12px 10px 11px}
.stat .k{font-family:var(--font-num);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:23px;line-height:1.15;letter-spacing:-.02em;margin-top:2px}
.stat .v.good{color:var(--good)}
.gauge{position:relative;height:3px;background:var(--line);margin-top:9px;border-radius:2px}
.gauge i{position:absolute;top:-2.5px;width:1px;height:8px;background:var(--muted);opacity:.55}
.gauge i.hi{background:var(--good);opacity:1}
.gauge b{position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-left:-4.5px;border:2px solid #fff}
.gauge-legend{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:9px;color:var(--muted);margin-top:5px}

/* ---------- risk bar ---------- */
.rwrap{position:relative;padding:2px 0}
.rbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line-2)}
.rseg{display:block;height:100%}
.r-out{background:#1F3A6E}.r-gb{background:#E1701A}.r-fb{background:#1E7A3C}.r-bb{background:#2E9BD6}.r-hr{background:#8E3FA8}
.r60{position:absolute;left:60%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.75}
.r60::after{content:"60%";position:absolute;left:3px;top:-1px;font-family:var(--font-num);font-size:8.5px;color:var(--ink);opacity:.7}
.rlegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
.rlegend span{display:flex;align-items:center;gap:5px}
.rlegend i{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.rverdict{background:var(--line-2);border-radius:11px;padding:11px 13px;margin-top:11px;color:var(--ink-2)}
.rverdict.ok{background:var(--good-soft);color:var(--good)}
.rverdict > div:first-child{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rverdict .k{font-size:12px}
.rverdict b{font-size:22px;letter-spacing:-.02em}
.rverdict .small{margin-top:2px;font-size:11.5px;opacity:.85}
.rmini{display:flex;align-items:center;gap:8px;width:100%}
.rmini .rwrap{flex:1}

/* ---------- lists ---------- */
.list-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-bottom:1px solid var(--line-2);background:#fff;
}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--line-2)}
.jersey{
  flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:13px;font-weight:600;
}
.jersey.dim{background:var(--line-2);color:var(--muted)}
.jersey.gr{font-size:11.5px;letter-spacing:-.02em}
.jersey.g4,.gchip.g4{background:#FBE9A8;color:#6B4E00}
.jersey.g3,.gchip.g3{background:#CFE1FA;color:#134A86}
.jersey.g2,.gchip.g2{background:#FAD4D0;color:#8E2418}
.jersey.g1,.gchip.g1{background:#CFEBD8;color:#14653C}
.jersey.dim.g4,.jersey.dim.g3,.jersey.dim.g2,.jersey.dim.g1{opacity:.45}
.gchip{
  display:inline-block;font-family:var(--font-num);font-size:10.5px;font-weight:600;
  padding:2px 6px;border-radius:5px;background:var(--line-2);color:var(--muted);margin-right:2px;
}
th.sel{background:var(--accent-soft);color:var(--accent-deep)}
td.sel{background:var(--accent-soft);font-weight:600}
td.sel.hi{background:var(--good-soft)}
.li-main{flex:1;min-width:0}
.li-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.li-val{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.li-val .b{font-size:17px;letter-spacing:-.01em}
.li-val .s{font-size:10.5px;color:var(--muted);letter-spacing:.06em}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff}
table{border-collapse:collapse;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
th,td{padding:8px 9px;border-bottom:1px solid var(--line-2);text-align:right}
th{
  font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:600;
  position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
}
th:first-child,td:first-child{
  text-align:left;position:sticky;left:0;background:#fff;font-family:var(--font-ui);
  font-size:12.5px;font-weight:600;box-shadow:1px 0 0 var(--line-2);
}
th:first-child{z-index:2}
td.hi{color:var(--good);font-weight:600}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(25,21,33,.42);z-index:60;display:none}
.backdrop.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
  border-radius:18px 18px 0 0;max-height:92vh;display:none;flex-direction:column;
  box-shadow:0 -8px 40px rgba(25,21,33,.2);
}
.sheet.open{display:flex}
.sheet-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);
  background:#fff;border-radius:18px 18px 0 0;
}
.sheet-head h2{margin:0;font-size:15px;font-weight:600;flex:1}
.sheet-body{overflow-y:auto;padding:14px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);
  display:flex;gap:10px;
}
.sheet-foot .btn{flex:1}
.x{width:32px;height:32px;border-radius:8px;background:var(--line-2);color:var(--ink-2);font-size:17px;line-height:1}

/* ---------- steppers ---------- */
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.f{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 9px 9px}
.f > span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{
  width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent-deep);font-size:17px;font-weight:600;line-height:1;
}
.stepper input{
  flex:1;min-width:0;text-align:center;padding:6px 2px;border:none;border-bottom:1px solid var(--line);
  border-radius:0;font-family:var(--font-num);font-size:17px;font-variant-numeric:tabular-nums;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.seg{display:flex;gap:5px}
.seg button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 0;font-family:var(--font-num);font-size:14px;background:#fff;color:var(--ink-2)}
.seg button.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;font-weight:600}
.derived{
  display:flex;flex-wrap:wrap;gap:14px;background:var(--accent-soft);border-radius:11px;padding:11px 13px;margin-bottom:12px;
}
.derived div{font-family:var(--font-num);font-size:12px;color:var(--accent-deep)}
.derived div b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.err{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:9px 0 8px;color:var(--muted);font-size:10.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .g{font-size:17px;line-height:1}
nav button.on{color:var(--accent-deep);font-weight:700}
nav button.on .g{transform:translateY(-1px)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:560px){.fields{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header class="top">
  <h1>オープン戦 成績管理</h1>
  <button class="eyebrow" id="syncBtn" style="border:none;background:none;padding:4px 0">scorebook</button>
</header>

<div id="errBar" style="display:none;background:#FBECE6;color:#B4441E;padding:10px 14px;font-size:12.5px"></div>
<main id="view"></main>

<nav>
  <button data-tab="stats" class="on"><span class="g">▤</span>成績一覧</button>
  <button data-tab="games"><span class="g">◈</span>試合</button>
  <button data-tab="player"><span class="g">◍</span>個別成績</button>
  <button data-tab="edit"><span class="g">⚙</span>編集</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   保存（ここだけ差し替えれば、後からサーバー共有に切り替えられます）
   ============================================================ */
const KEY = "rikkyo-scorebook-v1";
const store = {
  async load(){
    try{
      if(window.storage){
        const r = await window.storage.get(KEY, false);
        if(r && r.value) return JSON.parse(r.value);
      }
    }catch(e){/* キー未作成 */}
    try{
      const s = localStorage.getItem(KEY);
      if(s) return JSON.parse(s);
    }catch(e){}
    return null;
  },
  async save(obj){
    /* 共有中で合言葉があるときは、端末にも暗号化した状態でしか残さない。
       こうしておくと圏外でも合言葉を入れれば直前の内容を見られる。 */
    let payload = obj;
    if(canSync() && conn.pass){
      try{ payload = await encryptData(obj, conn.pass); }catch(e){ return false; }
    }
    const s = JSON.stringify(payload);
    try{ if(window.storage){ await window.storage.set(KEY, s, false); return true; } }catch(e){}
    try{ localStorage.setItem(KEY, s); return true; }catch(e){}
    return false;
  }
};

/* ============================================================
   共有（GitHubのファイルを置き場にする）
   ============================================================ */
const CONN_KEY = "rikkyo-scorebook-conn";
let conn = {owner:"", repo:"", branch:"main", path:"data.json", token:"", pass:"", editOK:false};
let sync = {state:"off", at:0, sha:null, base:0, msg:""};

function loadConn(){
  try{ const s = localStorage.getItem(CONN_KEY); if(s) conn = Object.assign(conn, JSON.parse(s)); }catch(e){}
  conn.pass = ""; conn.editOK = false;   /* 合言葉とパスキーは毎回入力してもらう */
  if(!conn.owner){
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    if(m){ conn.owner = m[1]; conn.repo = (location.pathname.split("/")[1] || ""); }
  }
}
function saveConn(){
  const keep = {owner:conn.owner, repo:conn.repo, branch:conn.branch, path:conn.path, token:conn.token};
  try{ localStorage.setItem(CONN_KEY, JSON.stringify(keep)); }catch(e){}
}
const canSync = () => !!(conn.owner && conn.repo && conn.path);
const canEdit = () => {
  if(!canSync()) return true;                 /* 共有を使わず端末内だけで使う場合 */
  if(!conn.token) return false;               /* 閲覧者 */
  if(!S.editKeyHash) return true;             /* 編集用パスキー未設定 */
  return !!conn.editOK;                        /* パスキーを入力済みの端末だけ */
};
const needEditKey = () => canSync() && !!conn.token && !!S.editKeyHash && !conn.editOK;

function setSync(state, msg){
  sync.state = state; sync.msg = msg || "";
  const el = document.getElementById("syncBtn");
  if(!el) return;
  const t = {
    off:"端末内のみ", sync:"通信中…", ok:"同期済 " + new Date(sync.at||Date.now()).toTimeString().slice(0,5),
    dirty:"未送信", err:"エラー"
  }[state] || "";
  el.textContent = (canSync() ? (canEdit()?"編集 ":"閲覧 ") : "") + t;
  el.className = "eyebrow" + (state==="ok"?" ok":state==="err"?" err":"");
}
let locked = false, lockMsg = "", editMsg = "";
let lastRaw = null;   /* 最後に手に入れた中身（暗号化されたまま） */
function bytesToB64(u8){
  let bin = "";
  for(let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
  return btoa(bin);
}
function b64ToBytes(b){
  const bin = atob(String(b).replace(/\s/g,""));
  const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function sha256hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("scorebook:" + str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function deriveKey(pass, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptData(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {enc:"aes-gcm-256", v:1, updatedAt: obj.updatedAt || Date.now(),
          salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct))};
}
async function decryptData(pkg, pass){
  const key = await deriveKey(pass, b64ToBytes(pkg.salt));
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(pkg.iv)}, key, b64ToBytes(pkg.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function decodePayload(raw){
  if(raw && raw.enc){
    if(!conn.pass){ locked = true; lockMsg = ""; throw new Error("LOCKED"); }
    try{ return await decryptData(raw, conn.pass); }
    catch(e){ locked = true; lockMsg = "合言葉が違います。もう一度入力してください。"; throw new Error("LOCKED"); }
  }
  return raw;
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function apiURL(){
  return `https://api.github.com/repos/${conn.owner}/${conn.repo}/contents/${encodeURI(conn.path)}`;
}
async function apiGet(){
  const h = {Accept:"application/vnd.github+json"};
  if(conn.token) h.Authorization = "Bearer " + conn.token;
  const r = await fetch(apiURL() + "?ref=" + encodeURIComponent(conn.branch) + "&t=" + Date.now(), {headers:h, cache:"no-store"});
  if(r.status === 404) return null;
  if(r.status === 401 || r.status === 403) throw new Error("トークンが正しくないか、権限が足りません");
  if(!r.ok) throw new Error("読み込みに失敗しました (" + r.status + ")");
  const j = await r.json();
  return {sha:j.sha, data:JSON.parse(b64decode(j.content))};
}
async function rawGet(){
  const url = `https://raw.githubusercontent.com/${conn.owner}/${conn.repo}/${conn.branch}/${encodeURI(conn.path)}?t=${Date.now()}`;
  const r = await fetch(url, {cache:"no-store"});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error("読み込みに失敗しました (" + r.status + ")");
  return {sha:null, data: await r.json()};
}
async function apiPut(json, sha){
  const body = {
    message: "成績更新 " + new Date().toLocaleString("ja-JP"),
    content: b64encode(json), branch: conn.branch
  };
  if(sha) body.sha = sha;
  const r = await fetch(apiURL(), {
    method:"PUT",
    headers:{Accept:"application/vnd.github+json", Authorization:"Bearer "+conn.token, "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if(r.status === 401 || r.status === 403) throw new Error("トークンが正しくないか、書き込み権限がありません");
  if(r.status === 409 || r.status === 422) throw new Error("CONFLICT");
  if(!r.ok) throw new Error("保存に失敗しました (" + r.status + ")");
  const j = await r.json();
  return j.content && j.content.sha;
}
function normalize(d){
  const o = Object.assign({players:[], games:[], bat:{}, pit:{}, updatedAt:0}, d||{});
  o.players.forEach(p=>{ if(p.grade===undefined) p.grade = /^[1-4]$/.test(String(p.num||"")) ? String(p.num) : ""; });
  return o;
}
async function pull(opts){
  opts = opts || {};
  if(!canSync()) return;
  setSync("sync");
  try{
    const got = conn.token ? await apiGet() : await rawGet();
    if(got && got.data && !opts.force && conn.token && (S.updatedAt||0) > (got.data.updatedAt||0)){
      sync.sha = got.sha; setSync("dirty"); schedulePush(); return;   /* この端末のほうが新しい */
    }
    if(got && got.data){
      lastRaw = got.data;
      const data = await decodePayload(got.data);
      S = normalize(data); locked = false; lockMsg = "";
      sync.sha = got.sha; sync.base = S.updatedAt || 0;
      await store.save(S);
    }
    sync.at = Date.now(); setSync("ok");
    if(!opts.silent) render();
    if(opts.toast) toast("最新を読み込みました");
  }catch(e){
    if(e.message === "LOCKED"){ setSync("ok"); render(); return; }
    setSync("err"); if(!opts.silent) toast(e.message);
  }
}
let pushTimer = null;
function schedulePush(){
  if(!canSync() || !conn.token) return;
  setSync("dirty");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>push(), 2500);
}
async function push(force){
  if(!canSync() || !conn.token) return;
  setSync("sync");
  try{
    let sha = sync.sha;
    try{
      const cur = await apiGet();
      if(cur){
        sha = cur.sha;
        const remoteAt = (cur.data && cur.data.updatedAt) || 0;
        if(!force && sync.base && remoteAt > sync.base){
          setSync("dirty");
          if(confirm("他の端末で先に更新されています。\n\nOK：相手の内容を読み込む（この端末の未送信分は消えます）\nキャンセル：この端末の内容で上書きする")){
            await pull({toast:true, force:true}); return;
          }
          return push(true);
        }
      }
    }catch(e){ if(/権限|トークン/.test(e.message)) throw e; }
    S.updatedAt = Date.now();
    const payload = conn.pass ? await encryptData(S, conn.pass) : S;
    const newSha = await apiPut(JSON.stringify(payload), sha);
    sync.sha = newSha || sha; sync.base = S.updatedAt; sync.at = Date.now();
    setSync("ok");
  }catch(e){
    if(e.message === "CONFLICT"){ sync.sha = null; return push(true); }
    setSync("err"); toast(e.message);
  }
}

/* ============================================================
   計算
   ============================================================ */
const BAT_FIELDS = [
  {k:"ab",  n:"打数"},   {k:"h",   n:"安打"},   {k:"d2",  n:"二塁打"},
  {k:"d3",  n:"三塁打"}, {k:"hr",  n:"本塁打"}, {k:"rbi", n:"打点"},
  {k:"r",   n:"得点"},   {k:"so",  n:"三振"},   {k:"bb",  n:"四球"},
  {k:"hbp", n:"死球"},   {k:"sh",  n:"犠打"},   {k:"sf",  n:"犠飛"},
  {k:"sb",  n:"盗塁"},   {k:"cs",  n:"盗塁死"}
];
const PIT_FIELDS = [
  {k:"bf", n:"打者"}, {k:"ab", n:"打数"}, {k:"np", n:"投球数"},
  {k:"h",  n:"安打"}, {k:"hr", n:"本塁打"},{k:"bb", n:"四球"},
  {k:"hbp",n:"死球"}, {k:"so", n:"三振"}, {k:"wp", n:"暴投"},
  {k:"r",  n:"失点"}, {k:"er", n:"自責点"}
];

const RISK_FIELDS = [
  {k:"rk_out", n:"完全アウト", short:"完全", cls:"r-out", hint:"内野フライ・三振"},
  {k:"rk_gb",  n:"ゴロ",       short:"ゴロ", cls:"r-gb"},
  {k:"rk_fb",  n:"外野フライ・ライナー", short:"外フライ", cls:"r-fb"},
  {k:"rk_bb",  n:"四死球",     short:"四死球", cls:"r-bb"},
  {k:"rk_hr",  n:"本塁打",     short:"本塁打", cls:"r-hr"}
];
const RISK_LINE = .60;

function emptyBat(){ const o={}; BAT_FIELDS.forEach(f=>o[f.k]=0); return o; }
function emptyPit(){ const o={outs:0, velo:0}; PIT_FIELDS.forEach(f=>o[f.k]=0); RISK_FIELDS.forEach(f=>o[f.k]=0); return o; }

function sumBat(rows){
  const t = emptyBat(); t.g = 0;
  rows.forEach(r=>{ BAT_FIELDS.forEach(f=>t[f.k]+= (+r[f.k]||0)); t.g++; });
  return t;
}
function sumPit(rows){
  const t = emptyPit(); t.g = 0;
  rows.forEach(r=>{
    PIT_FIELDS.forEach(f=>t[f.k]+= (+r[f.k]||0));
    RISK_FIELDS.forEach(f=>t[f.k]+= (+r[f.k]||0));
    t.outs += (+r.outs||0);
    t.velo = Math.max(t.velo, +r.velo||0);
    t.g++;
  });
  return t;
}
function batDerive(t){
  const single = t.h - t.d2 - t.d3 - t.hr;
  const tb  = single + 2*t.d2 + 3*t.d3 + 4*t.hr;
  const pa  = t.ab + t.bb + t.hbp + t.sh + t.sf;
  const obpD = t.ab + t.bb + t.hbp + t.sf;
  const avg = t.ab ? t.h/t.ab : null;
  const obp = obpD ? (t.h + t.bb + t.hbp)/obpD : null;
  const slg = t.ab ? tb/t.ab : null;
  return {
    single, tb, pa, avg, obp, slg,
    ops: (obp!=null && slg!=null) ? obp+slg : null,
    iso: (avg!=null && slg!=null) ? slg-avg : null,
    bbk: t.so ? t.bb/t.so : null,
    sbp: (t.sb+t.cs) ? t.sb/(t.sb+t.cs) : null
  };
}
function pitDerive(t){
  const ip = t.outs/3;
  return {
    ip,
    era:  t.outs ? t.er*27/t.outs : null,
    whip: t.outs ? (t.h + t.bb + t.hbp)*3/t.outs : null,
    kpct: t.bf ? t.so/t.bf : null,
    kbb:  t.bb ? t.so/t.bb : null
  };
}

function riskDerive(t){
  const total = RISK_FIELDS.reduce((a,f)=>a+(+t[f.k]||0), 0);
  const pct = {};
  RISK_FIELDS.forEach(f=> pct[f.k] = total ? t[f.k]/total : null);
  return {total, pct, core: total ? (t.rk_out + t.rk_gb)/total : null};
}

/* 表示フォーマット */
const dash = "—";
function f3(v){ if(v==null||!isFinite(v)) return dash; const s=v.toFixed(3); return v<1 && v>=0 ? s.slice(1) : s; }
function f2(v){ return (v==null||!isFinite(v)) ? dash : v.toFixed(2); }
function fpc(v){ return (v==null||!isFinite(v)) ? dash : Math.round(v*100)+"%"; }
function fip(outs){ const w=Math.floor(outs/3), r=outs%3; return w + (r? " "+r+"/3" : ""); }

/* チーム基準（エクセルの表記に合わせています） */
const MARK = {
  ops:{min:.400,max:1.200,base:.700,good:.900},
  iso:{min:0,max:.300,base:.150,good:.170},
  bbk:{min:0,max:2,good:1.00},
  avg:{min:.100,max:.500,base:.250,good:.300},
  era:{min:0,max:6,good:2.00,rev:true},
  whip:{min:.60,max:2.20,good:1.20,rev:true},
  kbb:{min:0,max:6,good:3.50}
};
function isGood(key,v){
  const m = MARK[key]; if(!m || v==null || !isFinite(v)) return false;
  return m.rev ? v <= m.good : v >= m.good;
}
function gauge(key,v){
  const m = MARK[key]; if(!m) return "";
  const pos = x => Math.max(0, Math.min(100, (x-m.min)/(m.max-m.min)*100));
  let h = '<div class="gauge">';
  if(m.base!=null) h += `<i style="left:${pos(m.base)}%"></i>`;
  h += `<i class="hi" style="left:${pos(m.good)}%"></i>`;
  if(v!=null && isFinite(v)) h += `<b style="left:${pos(v)}%"></b>`;
  h += "</div>";
  return h;
}

function riskBar(t, showLegend){
  const d = riskDerive(t);
  if(!d.total) return `<div class="small muted">リスク管理の入力がありません</div>`;
  let h = `<div class="rwrap"><div class="rbar">` +
    RISK_FIELDS.map(f=>{
      const w = t[f.k]/d.total*100;
      return w ? `<span class="rseg ${f.cls}" style="width:${w}%"></span>` : "";
    }).join("") + `</div><i class="r60"></i></div>`;
  if(showLegend){
    h += `<div class="rlegend">` + RISK_FIELDS.map(f=>
      `<span><i class="${f.cls}"></i>${f.n} <b class="num">${fpc(d.pct[f.k])}</b></span>`).join("") + `</div>`;
  }
  return h;
}
function riskVerdict(d){
  if(!d.total) return "";
  const ok = d.core >= RISK_LINE;
  return `<div class="rverdict ${ok?"ok":""}">
    <div><span class="k">完全アウト＋ゴロ</span><b class="num">${fpc(d.core)}</b></div>
    <div class="small">${ok ? "60%を超えています。失点のリスクに優れた投球です。"
      : "あと"+Math.ceil(RISK_LINE*d.total - d.total*d.core)+"つが完全アウトかゴロなら60%に届きます。"}</div>
  </div>`;
}

function periodGames(){
  let gs = S.games.slice().sort((a,b)=> a.date < b.date ? 1 : -1);
  if(ui.team !== "all") gs = gs.filter(g => (g.team||"") === ui.team);
  const today = new Date();
  if(ui.period==="all") return gs;
  if(ui.period==="last6") return gs.slice(0, 6);
  if(ui.period==="d30"){
    const d = new Date(today.getTime()-29*864e5).toISOString().slice(0,10);
    return gs.filter(g=>g.date>=d);
  }
  return gs.filter(g=> (!ui.from || g.date>=ui.from) && (!ui.to || g.date<=ui.to));
}
function hasScore(g){ return g && g.rs !== "" && g.ra !== "" && g.rs != null && g.ra != null; }
function gameResult(g){
  if(!hasScore(g)) return null;
  return (+g.rs) > (+g.ra) ? "win" : (+g.rs) < (+g.ra) ? "lose" : "draw";
}
function resultTag(g){
  const r = gameResult(g);
  if(!r) return "";
  const label = {win:"勝", lose:"敗", draw:"分"}[r];
  return `<span class="res ${r}">${label}</span>`;
}
function scoreText(g){ return hasScore(g) ? `${+g.rs}-${+g.ra}` : ""; }
function record(games){
  let w=0,l=0,d=0;
  games.forEach(g=>{ const r=gameResult(g); if(r==="win")w++; else if(r==="lose")l++; else if(r==="draw")d++; });
  return {w,l,d};
}
function teamLabel(){ return ui.team==="all" ? "A・B合計" : ui.team + "チーム"; }
function teamTag(g){ return g.team ? `<span class="badge tm${g.team}">${g.team}</span>` : ""; }
function periodLabel(){
  if(ui.period==="all") return "全期間";
  if(ui.period==="last6") return "直近6試合";
  if(ui.period==="d30") return "直近30日";
  return (ui.from||"開始") + " 〜 " + (ui.to||"今日");
}
function rowsFor(side, playerId, games){
  const src = side==="bat" ? S.bat : S.pit;
  const out = [];
  games.forEach(g=>{ const r = src[g.id] && src[g.id][playerId]; if(r) out.push(Object.assign({_g:g}, r)); });
  return out;
}
function byGrade(a,b){ return (parseInt(b.grade||"0")||0)-(parseInt(a.grade||"0")||0) || a.name.localeCompare(b.name,"ja"); }
function gradeTag(p){ return p.grade ? p.grade+"年" : "–"; }
function playerName(id){ const p = S.players.find(p=>p.id===id); return p ? p.name : "(削除された選手)"; }
function playerOf(id){ return S.players.find(p=>p.id===id); }
function gameLabel(g){ return g.opponent || "（対戦相手なし）"; }
function jp(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${+m}/${+dd}`; }

let sortScroll = 0;
function sortChips(side){
  return `<div class="small muted" style="margin:0 2px 6px">並び替え（選んだ項目を大きく表示・強調します）</div>
    <div class="scroll-x" id="sortRow" style="margin-bottom:10px">` +
    colsFor(side).map(c=>`<button class="chip ${ui.sort===c.k?"on":""}" data-act="sort" data-v="${c.k}">${c.n}${c.asc?" ↓":""}</button>`).join("") +
    `</div>`;
}
function restoreSortScroll(){
  const sr = document.getElementById("sortRow");
  if(!sr) return;
  sr.scrollLeft = sortScroll;
  sr.addEventListener("scroll", ()=>{ sortScroll = sr.scrollLeft; });
}

function glossary(side){
  return `<details class="card" style="margin-top:16px"><summary class="card-pad" style="cursor:pointer;font-size:13.5px;color:var(--accent-deep);font-weight:600">指標の見かた</summary>
    <div class="card-pad" style="padding-top:0">` +
    GLOSSARY[side].map(g=>`<div style="margin-bottom:11px"><div style="font-weight:600;font-size:13px">${g[0]}</div>
      <div class="small muted">${g[1]}</div></div>`).join("") + `</div></details>`;
}
function gradeCls(p){ return p && p.grade ? "g"+p.grade : ""; }
function chip(group,val,label){
  const on = ui[group]===val;
  return `<button class="chip ${on?"on":""}" data-act="set" data-g="${group}" data-v="${val}">${label}</button>`;
}

const colsFor = side => side==="bat" ? BAT_COLS : PIT_COLS;
function colOf(side, k){ return colsFor(side).find(c=>c.k===k) || colsFor(side)[0]; }
function sortRows(rows, col){
  const NUL = col.asc ? Infinity : -Infinity;
  rows.sort((a,b)=>{
    const va = col.v(a), vb = col.v(b);
    const x = (va==null||!isFinite(va)) ? NUL : va, y = (vb==null||!isFinite(vb)) ? NUL : vb;
    return col.asc ? x-y : y-x;
  });
}
function tableHTML(cols, rows){
  let h = `<div class="card"><div class="tablewrap"><table><thead><tr><th>選手</th>`;
  cols.forEach(c=>h+=`<th class="${c.k===ui.sort?"sel":""}">${c.n}</th>`);
  h += `</tr></thead><tbody>`;
  rows.forEach(r=>{
    h += `<tr><td>${esc(playerName(r.id))}</td>`;
    cols.forEach(c=> h += `<td class="${c.hi && c.hi(r) ? "hi":""} ${c.k===ui.sort?"sel":""}">${c.f(r)}</td>`);
    h += `</tr>`;
  });
  return h + `</tbody></table></div></div><div class="small muted" style="margin:6px 2px">横にスクロールすると全項目が見られます。緑は優秀ライン到達。</div>`;
}

function renderPlayerPicker(){
  const ps = S.players.slice().sort(byGrade);
  let h = `<div class="card card-pad" style="padding-bottom:12px">
    <input type="text" id="qsel" placeholder="名前・学年で検索" autocomplete="off"></div>`;
  if(!ps.length){
    h += `<div class="card"><div class="empty"><strong>選手がまだいません</strong>「編集」タブで名簿を読み込むか、選手を登録してください。<br>
      <button class="btn ghost" data-act="goEdit" style="margin-top:12px">編集タブへ</button></div></div>`;
  }else{
    h += `<div class="card" id="pickList">` + ps.map(p=>`
      <button class="list-item" data-act="pickPlayer" data-id="${p.id}" data-name="${esc(searchKey(p))}">
        <span class="jersey gr ${gradeCls(p)} ${p.active===false?"dim":""}">${gradeTag(p)}</span>
        <span class="li-main"><span class="li-name">${esc(p.name)}</span>
          <span class="li-sub">${p.bats?"打者":""}${p.bats&&p.pitches?" ・ ":""}${p.pitches?"投手":""}</span></span>
        <span class="muted">›</span></button>`).join("") +
      `<div class="empty small" data-none style="display:none">見つかりませんでした</div></div>`;
  }
  view.innerHTML = h;
}
function searchKey(p){
  return (gradeTag(p) + " " + p.name).toLowerCase().replace(/[\s　]/g,"");
}
function renderPlayerPage(){
  const p = playerOf(ui.playerId);
  if(!p){ ui.playerId = null; return renderPlayerPicker(); }
  if(ui.pside==="bat" && !p.bats) ui.pside = "pit";
  if(ui.pside==="pit" && !p.pitches) ui.pside = "bat";
  const games = periodGames();
  const rs = rowsFor(ui.pside, ui.playerId, games);

  let h = `<div class="spread" style="margin-bottom:12px">
    <button class="chip" data-act="backPicker">‹ 選手一覧</button>
    <div class="scroll-x" style="gap:7px">${chip("team","all","A・B")}${chip("team","A","A")}${chip("team","B","B")}</div></div>`;
  h += `<div class="card card-pad spread" style="align-items:flex-start">
    <div><div style="font-weight:600;font-size:18px">${esc(p.name)}</div>
      <div class="small muted">${teamLabel()}・${periodLabel()}・${rs.length}試合</div></div>
    <span class="jersey gr ${gradeCls(p)}">${gradeTag(p)}</span></div>`;
  h += `<div class="scroll-x" style="margin-bottom:10px">
    ${chip("period","all","全期間")}${chip("period","d30","直近30日")}${chip("period","last6","直近6試合")}${chip("period","custom","期間指定")}</div>`;
  if(ui.period==="custom"){
    h += `<div class="card card-pad row" style="gap:8px">
      <input type="date" id="fromD" value="${ui.from}"><span class="muted">〜</span><input type="date" id="toD" value="${ui.to}"></div>`;
  }
  if(p.bats && p.pitches){
    h += `<div class="scroll-x" style="margin-bottom:10px">
      <button class="chip ${ui.pside==="bat"?"on":""}" data-act="pside" data-v="bat">打者成績</button>
      <button class="chip ${ui.pside==="pit"?"on":""}" data-act="pside" data-v="pit">投手成績</button></div>`;
  }

  if(!rs.length){
    h += `<div class="card"><div class="empty"><strong>この条件の記録はありません</strong>チームや期間を変えるか、「試合」タブから成績を入力してください。</div></div>`;
    view.innerHTML = h; return;
  }

  if(ui.pside==="bat"){
    const t = sumBat(rs), d = batDerive(t);
    h += `<div class="card"><div class="statgrid">
      ${statCell("打率","avg",d.avg,f3)}${statCell("出塁率",null,d.obp,f3)}${statCell("長打率",null,d.slg,f3)}
      ${statCell("OPS","ops",d.ops,f3)}${statCell("ISO","iso",d.iso,f3)}${statCell("BB/K","bbk",d.bbk,f2)}
    </div></div>`;
    h += `<div class="card card-pad"><div class="row small num" style="flex-wrap:wrap;gap:12px">
      <span>${d.pa}打席</span><span>${t.ab}打数</span><span>${t.h}安打</span><span>${t.d2}二塁打</span>
      <span>${t.d3}三塁打</span><span>${t.hr}本塁打</span><span>${d.tb}塁打</span><span>${t.rbi}打点</span>
      <span>${t.r}得点</span><span>${t.bb}四球</span><span>${t.hbp}死球</span><span>${t.so}三振</span>
      <span>${t.sh}犠打</span><span>${t.sf}犠飛</span><span>盗塁${t.sb}/${t.sb+t.cs}</span>
    </div></div>`;
    h += `<div class="sec-label">試合ごと</div><div class="card"><div class="tablewrap"><table>
      <thead><tr><th>試合</th><th>打席</th><th>打数</th><th>安打</th><th>本</th><th>点</th><th>四死</th><th>三振</th><th>打率</th></tr></thead><tbody>` +
      rs.map(r=>{ const tt=sumBat([r]), dd=batDerive(tt);
        return `<tr><td>${jp(r._g.date)}${r._g.team?" ["+r._g.team+"]":""} ${esc(gameLabel(r._g))}</td><td>${dd.pa}</td><td>${tt.ab}</td><td>${tt.h}</td>
        <td>${tt.hr}</td><td>${tt.rbi}</td><td>${tt.bb+tt.hbp}</td><td>${tt.so}</td><td>${f3(dd.avg)}</td></tr>`;
      }).join("") + `</tbody></table></div></div>`;
  }else{
    const t = sumPit(rs), d = pitDerive(t);
    h += `<div class="card"><div class="statgrid">
      ${statCell("防御率","era",d.era,f2)}${statCell("WHIP","whip",d.whip,f2)}${statCell("K/BB","kbb",d.kbb,f2)}
      <div class="stat"><div class="k">IP</div><div class="v">${fip(t.outs)}</div></div>
      <div class="stat"><div class="k">K%</div><div class="v">${fpc(d.kpct)}</div></div>
      <div class="stat"><div class="k">MAX</div><div class="v">${t.velo||dash}</div></div>
    </div></div>`;
    h += `<div class="card card-pad"><div class="row small num" style="flex-wrap:wrap;gap:12px">
      <span>${t.g}試合</span><span>${t.bf}打者</span><span>${t.np}球</span><span>${t.h}安打</span><span>${t.hr}被本塁打</span>
      <span>${t.bb}四球</span><span>${t.hbp}死球</span><span>${t.so}三振</span><span>${t.wp}暴投</span>
      <span>${t.r}失点</span><span>${t.er}自責点</span>

    const rk = riskDerive(t);
    h += `<div class="sec-label">リスク管理</div><div class="card card-pad">
      ${riskBar(t, true)}${riskVerdict(rk)}
      ${rk.total ? "" : `<div class="small muted" style="margin-top:8px">「試合」タブの投手成績入力から、結果のパターンを入力すると表示されます。</div>`}</div>`;
    if(rk.total){
      h += `<div class="card"><div class="tablewrap"><table>
        <thead><tr><th>試合</th>${RISK_FIELDS.map(f=>`<th>${f.short}</th>`).join("")}<th>計</th><th>完全+ゴロ</th></tr></thead><tbody>` +
        rs.map(r=>{ const tt=sumPit([r]), dd=riskDerive(tt);
          return `<tr><td>${jp(r._g.date)}${r._g.team?" ["+r._g.team+"]":""} ${esc(gameLabel(r._g))}</td>` +
            RISK_FIELDS.map(f=>`<td>${tt[f.k]||0}</td>`).join("") +
            `<td>${dd.total}</td><td class="${dd.core!=null&&dd.core>=RISK_LINE?"hi":""}">${fpc(dd.core)}</td></tr>`;
        }).join("") + `</tbody></table></div></div>`;
    }
    h += `<div class="sec-label">試合ごと</div><div class="card"><div class="tablewrap"><table>
      <thead><tr><th>試合</th><th>回</th><th>球数</th><th>安打</th><th>四死</th><th>三振</th><th>失点</th><th>自責</th><th>防御率</th><th>最高球速</th></tr></thead><tbody>` +
      rs.map(r=>{ const tt=sumPit([r]), dd=pitDerive(tt);
        return `<tr><td>${jp(r._g.date)}${r._g.team?" ["+r._g.team+"]":""} ${esc(gameLabel(r._g))}</td><td>${fip(tt.outs)}</td><td>${tt.np}</td><td>${tt.h}</td>

      }).join("") + `</tbody></table></div></div>`;
  }
  h += glossary(ui.pside);
  view.innerHTML = h;
}
function statCell(label, key, v, fmt){
  const good = key && isGood(key, v);
  return `<div class="stat"><div class="k">${label}</div>
    <div class="v ${good?"good":""}">${fmt(v)}</div>${key?gauge(key,v):""}</div>`;
}

function renderGames(){
  let gs = S.games.slice().sort((a,b)=> a.date<b.date?1:-1);
  if(ui.team !== "all") gs = gs.filter(g=>(g.team||"")===ui.team);
  let h = canEdit() ? `<button class="btn block" data-act="newGame" style="margin-bottom:12px">＋ 試合を追加</button>`
                    : `<div class="viewbar"><b>閲覧モード</b>最新の成績を見られます。</div>`;
  h += `<div class="scroll-x" style="margin-bottom:10px">
    ${chip("team","all","A・B合計")}${chip("team","A","Aチーム")}${chip("team","B","Bチーム")}</div>`;
  if(!gs.length){
    h += `<div class="card"><div class="empty"><strong>試合がまだありません</strong>日付・対戦相手・A/Bと最終スコアを登録すると、その試合の成績を入力できます。</div></div>`;
  }else{
    const rec = record(gs);
    h += `<div class="card card-pad spread" style="padding-top:11px;padding-bottom:11px">
      <span class="small muted">${teamLabel()}・${gs.length}試合</span>
      <span class="num" style="font-size:15px;font-weight:600">${rec.w}勝 ${rec.l}敗 ${rec.d}分</span></div>`;
    h += `<div class="card">` + gs.map(g=>{
      const nb = Object.keys(S.bat[g.id]||{}).length, np = Object.keys(S.pit[g.id]||{}).length;
      return `<button class="list-item" data-act="openGame" data-id="${g.id}">
        <span class="jersey dim num" style="font-size:11px">${jp(g.date)}</span>
        <span class="li-main"><span class="li-name">${teamTag(g)} ${esc(gameLabel(g))}</span>
          <span class="li-sub">${esc(g.venue||"")}${g.venue?" ・ ":""}打者${nb}名 / 投手${np}名</span></span>
        ${hasScore(g) ? `<span class="li-val"><span class="b num">${scoreText(g)}</span><span class="s">${resultTag(g)}</span></span>`
                      : `<span class="badge">スコア未入力</span>`}
        <span class="muted">›</span></button>`;
    }).join("") + `</div>`;
  }
  view.innerHTML = h;
}
function renderGameDetail(){
  const g = S.games.find(x=>x.id===ui.gameId);
  if(!g){ ui.gameId=null; return renderGames(); }
  const bat = S.bat[g.id]||{}, pit = S.pit[g.id]||{};

  let h = `<button class="chip" data-act="backGames" style="margin-bottom:12px">‹ 試合一覧</button>`;
  h += `<div class="card card-pad spread">

      ${hasScore(g) ? `<div class="num" style="font-size:21px;font-weight:600;margin-top:6px">${scoreText(g)} ${resultTag(g)}</div>`
                    : `<div class="small muted" style="margin-top:6px">スコア未入力（「編集」から入れられます）</div>`}</div>
    ${ro?"":`<button class="btn line" data-act="editGame">編集</button>`}</div>`;

  const batters = S.players.filter(p=>p.bats && p.active!==false);
  const pitchers = S.players.filter(p=>p.pitches && p.active!==false);
  const doneB = batters.filter(p=>bat[p.id]), restB = batters.filter(p=>!bat[p.id]);
  const doneP = pitchers.filter(p=>pit[p.id]), restP = pitchers.filter(p=>!pit[p.id]);

  if(!S.players.length){
    h += `<div class="card"><div class="empty"><strong>選手がまだ登録されていません</strong>

      <button class="btn ghost" data-act="goEdit" style="margin-top:12px">編集タブへ</button></div></div>`;
    view.innerHTML = h; return;
  }

  h += `<div class="sec-label">打者成績</div><div class="card">`;
  if(!batters.length) h += `<div class="empty small">打者として登録された選手がいません。編集タブで選手の区分（打／投）を確認してください。</div>`;
  else if(!doneB.length) h += `<div class="empty small">下の「選手を選んで入力」から追加します。</div>`;
  h += doneB.map(p=>{
    const t = sumBat([bat[p.id]]), d = batDerive(t);
    return `<button class="list-item" data-act="editBat" data-id="${p.id}">
      <span class="jersey gr ${gradeCls(p)}">${gradeTag(p)}</span>
      <span class="li-main"><span class="li-name">${esc(p.name)}</span>
        <span class="li-sub num">${t.ab}打数${t.h}安打 ${t.hr?t.hr+"本 ":""}${t.rbi}打点 ${t.bb+t.hbp}四死球 ${t.so}三振</span></span>
      <span class="li-val"><span class="b">${f3(d.avg)}</span><span class="s">AVG</span></span></button>`;
  }).join("");
  h += `</div>`;
  h += (restB.length && !ro) ? `<details class="card" ${doneB.length?"":"open"}><summary class="card-pad" style="cursor:pointer;font-size:13.5px;color:var(--accent-deep);font-weight:600">選手を選んで入力（未入力 ${restB.length}名）</summary>
    <div class="card-pad" style="padding-top:0"><input type="text" id="qb" placeholder="名前・学年で検索" autocomplete="off"></div>
    ${restB.map(p=>`<button class="list-item" data-act="editBat" data-id="${p.id}" data-name="${esc(searchKey(p))}">
      <span class="jersey gr ${gradeCls(p)}" style="opacity:.5">${gradeTag(p)}</span><span class="li-main"><span class="li-name">${esc(p.name)}</span></span>
      <span class="muted">＋</span></button>`).join("")}
    <div class="empty small" data-none style="display:none">見つかりませんでした</div></details>` : "";

  h += `<div class="sec-label">投手成績</div><div class="card">`;
  if(!pitchers.length) h += `<div class="empty small">投手として登録された選手がいません。編集タブで選手の区分（打／投）を確認してください。</div>`;
  else if(!doneP.length) h += `<div class="empty small">下の「選手を選んで入力」から追加します。</div>`;
  h += doneP.map(p=>{
    const t = sumPit([pit[p.id]]), d = pitDerive(t);
    return `<button class="list-item" data-act="editPit" data-id="${p.id}">
      <span class="jersey gr ${gradeCls(p)}">${gradeTag(p)}</span>
      <span class="li-main"><span class="li-name">${esc(p.name)}</span>
        <span class="li-sub num">${fip(t.outs)}回 ${t.np}球 ${t.h}安打 ${t.so}三振 ${t.er}自責${t.velo?" MAX"+t.velo:""}${riskDerive(t).total?" ・ 完全+ゴロ "+fpc(riskDerive(t).core):""}</span></span>
      <span class="li-val"><span class="b">${f2(d.era)}</span><span class="s">ERA</span></span></button>`;
  }).join("");
  h += `</div>`;
  h += (restP.length && !ro) ? `<details class="card" ${doneP.length?"":"open"}><summary class="card-pad" style="cursor:pointer;font-size:13.5px;color:var(--accent-deep);font-weight:600">選手を選んで入力（未入力 ${restP.length}名）</summary>
    <div class="card-pad" style="padding-top:0"><input type="text" id="qp" placeholder="名前・学年で検索" autocomplete="off"></div>
    ${restP.map(p=>`<button class="list-item" data-act="editPit" data-id="${p.id}" data-name="${esc(searchKey(p))}">
      <span class="jersey gr ${gradeCls(p)}" style="opacity:.5">${gradeTag(p)}</span><span class="li-main"><span class="li-name">${esc(p.name)}</span></span>
      <span class="muted">＋</span></button>`).join("")}
    <div class="empty small" data-none style="display:none">見つかりませんでした</div></details>` : "";

  if(!ro) h += `<button class="btn danger block" data-act="delGame" style="margin-top:18px">この試合を削除</button>`;
  view.innerHTML = h;
}

/* ---------- 成績入力シート ---------- */
let sheetState = null;
function openBatSheet(gameId, pid){
  const cur = (S.bat[gameId]||{})[pid];
  sheetState = {type:"bat", gameId, pid, v: Object.assign(emptyBat(), cur||{})};
  drawBatSheet();
}
function drawBatSheet(){
  const {v, pid} = sheetState;
  const t = sumBat([v]), d = batDerive(t);
  const bad = (v.d2+v.d3+v.hr) > v.h || v.h > v.ab;
  let b = "";
  b += `<div class="derived">
    <div>打席<b>${d.pa}</b></div><div>単打<b>${d.single}</b></div><div>塁打<b>${d.tb}</b></div>
    <div>打率<b>${f3(d.avg)}</b></div><div>OPS<b>${f3(d.ops)}</b></div></div>`;
  if(bad) b += `<div class="err">安打より長打が多い、または打数より安打が多い状態です。数値を確認してください。</div>`;
  b += `<div class="fields">` + BAT_FIELDS.map(f=>stepperHTML(f.k,f.n,v[f.k])).join("") + `</div>`;
  b += `<div class="small muted" style="margin-top:12px">打席・単打・塁打・打率・出塁率・長打率・OPS・ISO は入力値から自動計算されます。</div>`;
  const foot = `<button class="btn line" data-act="delEntry">削除</button><button class="btn" data-act="saveEntry" ${bad?"disabled":""}>保存</button>`;
  openSheet(`${playerName(pid)}・打者成績`, b, foot, sheetState.drawn);
  sheetState.drawn = true;
}
function openPitSheet(gameId, pid){
  const cur = (S.pit[gameId]||{})[pid];
  sheetState = {type:"pit", gameId, pid, v: Object.assign(emptyPit(), cur||{})};
  drawPitSheet();
}
function drawPitSheet(){
  const {v, pid} = sheetState;
  const t = sumPit([v]), d = pitDerive(t);
  const whole = Math.floor(v.outs/3), rem = v.outs%3;
  let b = "";
  b += `<div class="derived">
    <div>投球回<b>${fip(v.outs)}</b></div><div>防御率<b>${f2(d.era)}</b></div>
    <div>WHIP<b>${f2(d.whip)}</b></div><div>K%<b>${fpc(d.kpct)}</b></div></div>`;
  b += `<div class="f" style="margin-bottom:9px"><span>投球回（イニング）</span>
    <div class="stepper"><button data-step="-1" data-k="__ip">−</button>
    <input type="number" inputmode="numeric" data-k="__ip" value="${whole}"><button data-step="1" data-k="__ip">＋</button></div>
    <span style="margin:8px 0 5px">アウト（1/3単位）</span>
    <div class="seg">${[0,1,2].map(n=>`<button data-act="outs" data-v="${n}" class="${rem===n?"on":""}">${n?n+"/3":"0"}</button>`).join("")}</div></div>`;
  b += `<div class="fields">` + PIT_FIELDS.map(f=>stepperHTML(f.k,f.n,v[f.k])).join("") +
       stepperHTML("velo","最高球速 km/h", v.velo) + `</div>`;
  b += `<div class="small muted" style="margin-top:12px">防御率・WHIP・K%・K/BB は自動計算です。WHIPは（安打＋四球＋死球）÷投球回で算出しています。</div>`;

  const rd = riskDerive(v);
  b += `<div class="sec-label">リスク管理</div>`;
  b += `<div class="card card-pad">
    <div class="small muted" style="margin-bottom:10px">この投手が投げているときに起きた結果を、打者1人ずつ数えて入力します。完全アウトは内野フライと三振です。</div>
    ${riskBar(v, true)}
    ${rd.total ? riskVerdict(rd) : ""}
    <div class="fields" style="margin-top:12px">` +
      RISK_FIELDS.map(f=>stepperHTML(f.k, f.n + (f.hint?"（"+f.hint+"）":""), v[f.k])).join("") +
    `</div>
    <div class="spread" style="margin-top:10px">
      <span class="small muted num">計 ${rd.total}</span>
      <button class="chip" data-act="riskFill">四死球・本塁打を上の成績から入れる</button>
    </div></div>`;
  const foot = `<button class="btn line" data-act="delEntry">削除</button><button class="btn" data-act="saveEntry">保存</button>`;
  openSheet(`${playerName(pid)}・投手成績`, b, foot, sheetState.drawn);
  sheetState.drawn = true;
}
function stepperHTML(k,label,val){
  return `<div class="f"><span>${label}</span><div class="stepper">
    <button data-step="-1" data-k="${k}">−</button>
    <input type="number" inputmode="numeric" data-k="${k}" value="${val||0}">
    <button data-step="1" data-k="${k}">＋</button></div></div>`;
}
function saveEntry(){
  const {type, gameId, pid, v} = sheetState;
  const bag = type==="bat" ? S.bat : S.pit;
  if(!bag[gameId]) bag[gameId] = {};
  bag[gameId][pid] = v;
  persist(); closeSheet(); render(); toast("保存しました");
}
function delEntry(){
  const {type, gameId, pid} = sheetState;
  const bag = type==="bat" ? S.bat : S.pit;
  if(bag[gameId]) delete bag[gameId][pid];
  persist(); closeSheet(); render(); toast("削除しました");
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  const rows = []; let row = [], cur = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur+='"'; i++; } else q = false; }
      else cur += c;
    }else{
      if(c === '"') q = true;
      else if(c === ","){ row.push(cur); cur = ""; }
      else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else if(c === "\t"){ row.push(cur); cur = ""; }
      else cur += c;
    }
  }
  row.push(cur); rows.push(row);
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
const BAT_ALIAS = {
  name:["選手","選手名","名前","氏名","player"],
  ab:["打数","AB"], h:["安打","安打数","ヒット","H"], d2:["二塁打","2B"], d3:["三塁打","3B"],
  hr:["本塁打","HR","ホームラン"], rbi:["打点","RBI"], r:["得点","R"], so:["三振","K","SO","奪三振"],
  bb:["四球","BB"], hbp:["死球","HBP"], sh:["犠打","犠打数","SH"], sf:["犠飛","SF"],
  sb:["盗塁","SB"], cs:["盗塁死","CS"]
};
const PIT_ALIAS = {
  name:["選手","選手名","名前","氏名","player"],
  ip:["投球回","イニング","IP","回"], bf:["打者","対戦打者","BF","打者数"], ab:["打数","AB"],
  np:["投球数","球数","P"], h:["安打","被安打","H"], hr:["本塁打","被本塁打","HR"],
  bb:["四球","与四球","BB"], hbp:["死球","与死球","HBP"], so:["三振","奪三振","K","SO"],
  wp:["暴投","WP"], r:["失点","R"], er:["自責点","自責","ER"], velo:["最高球速","球速","MAX"]
};
function mapHeaders(head, alias){
  const idx = {};
  const clean = h => String(h).replace(/\s|　/g,"").replace(/[（(].*?[)）]/g,"");
  head.forEach((h,i)=>{
    const c = clean(h);
    for(const key in alias){
      if(idx[key]!=null) continue;
      if(alias[key].some(a => c === a)) idx[key] = i;
    }
  });
  return idx;
}
function toNum(x){
  if(x==null) return 0;
  const s = String(x).replace(/[,%\s　]/g,"");
  if(!s || /DIV|VALUE|N\/A|#/.test(s)) return 0;
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function parseIP(x){
  const s = String(x||"").trim();
  let m = s.match(/^(\d+)\s+(\d)\/3$/);            // 17 1/3
  if(m) return +m[1]*3 + +m[2];
  m = s.match(/^(\d+)\.(\d)$/);                     // 17.1 / 17.2
  if(m && +m[2] <= 2) return +m[1]*3 + +m[2];
  const n = parseFloat(s.replace(/[^\d.]/g,""));
  return isFinite(n) ? Math.round(n*3) : 0;
}
function importPreview(){

  const idx = mapHeaders(rows[0], alias);

    }else{
      PIT_FIELDS.forEach(f=> o[f.k] = idx[f.k]!=null ? Math.round(toNum(r[idx[f.k]])) : 0);
      o.outs = idx.ip!=null ? parseIP(r[idx.ip]) : 0;
      o.velo = idx.velo!=null ? Math.round(toNum(r[idx.velo])) : 0;
    }
    parsed.push(o);
  }
  if(!parsed.length){ toast("取り込める行がありませんでした"); return; }
  pendingImport = parsed;
  const found = Object.keys(idx).filter(k=>k!=="name").map(k=>k).length;
  const known = parsed.filter(p=>S.players.some(x=>x.name===p.name)).length;
  let b = `<div class="small muted" style="margin-bottom:10px">${parsed.length}名分・${found}項目を認識しました。登録済みの選手 ${known}名、新規 ${parsed.length-known}名（新規は自動で登録します）。</div>`;
  b += `<div class="card"><div class="tablewrap"><table><thead><tr><th>選手</th>` +
    (impSide==="bat" ? BAT_FIELDS.map(f=>`<th>${f.n}</th>`).join("")
                     : `<th>投球回</th>`+PIT_FIELDS.map(f=>`<th>${f.n}</th>`).join("")+`<th>球速</th>`) +
    `</tr></thead><tbody>` +
    parsed.map(p=>`<tr><td>${esc(p.name)}</td>` +
      (impSide==="bat" ? BAT_FIELDS.map(f=>`<td>${p[f.k]}</td>`).join("")
                       : `<td>${fip(p.outs)}</td>`+PIT_FIELDS.map(f=>`<td>${p[f.k]}</td>`).join("")+`<td>${p.velo||dash}</td>`) +
      `</tr>`).join("") + `</tbody></table></div></div>`;
  b += `<div class="small muted" style="margin-top:10px">0になっている列は、見出し名が一致しなかった項目です。見出しを「安打」「二塁打」などに直すと拾えます。</div>`;
  openSheet("取り込み内容の確認", b, `<button class="btn line" data-act="closeSheet">やめる</button><button class="btn" data-act="impRun">取り込む</button>`);
}
let pendingImport = null;
function runImport(){
  if(!pendingImport) return;
  const g = {id:uid(), date:impDate, opponent:impLabel || "過去データ取込", venue:"", imported:true};
  S.games.push(g);
  const bag = impSide==="bat" ? S.bat : S.pit;
  bag[g.id] = {};
  pendingImport.forEach(p=>{
    let pl = S.players.find(x=>x.name===p.name);
    if(!pl){
      pl = {id:uid(), grade:"", name:p.name, bats:impSide==="bat", pitches:impSide==="pit", active:true};
      S.players.push(pl);
    }else{
      if(impSide==="bat") pl.bats = true; else pl.pitches = true;
    }
    const rec = impSide==="bat" ? emptyBat() : emptyPit();
    Object.keys(rec).forEach(k=>{ if(p[k]!=null) rec[k] = p[k]; });
    bag[g.id][pl.id] = rec;
  });
  pendingImport = null; persist(); closeSheet(); ui.tab="stats"; render();
  toast("取り込みました");
}
function exportCsv(side){
  const games = periodGames();
  const ids = S.players.filter(p=> side==="bat" ? p.bats : p.pitches).map(p=>p.id);
  let head, lines = [];
  if(side==="bat"){
    head = ["選手","学年","OPS","打率","打席","打数","安打数","単打","二塁打","三塁打","本塁打","塁打","打点","得点","三振","四球","死球","犠打","犠飛","盗塁","盗塁死","盗塁成功率","出塁率","長打率","BB/K","ISO"];
    ids.forEach(id=>{
      const rs = rowsFor("bat", id, games); if(!rs.length) return;
      const t = sumBat(rs), d = batDerive(t);
      lines.push([playerName(id), (playerOf(id)||{}).grade||"", n3(d.ops), n3(d.avg), d.pa, t.ab, t.h, d.single, t.d2, t.d3, t.hr, d.tb, t.rbi, t.r, t.so, t.bb, t.hbp, t.sh, t.sf, t.sb, t.cs, n3(d.sbp), n3(d.obp), n3(d.slg), n2(d.bbk), n3(d.iso)]);
    });
  }else{
    head = ["選手","学年","K/BB","試合","防御率","投球回","打者","打数","投球数","安打","本塁打","四球","死球","三振","K%","暴投","失点","自責点","WHIP","最高球速","完全アウト","ゴロ","外野フライ・ライナー","四死球","本塁打(リスク)","計","完全アウト+ゴロ"];
    ids.forEach(id=>{
      const rs = rowsFor("pit", id, games); if(!rs.length) return;
      const t = sumPit(rs), d = pitDerive(t);
      const rk = riskDerive(t);
      lines.push([playerName(id), (playerOf(id)||{}).grade||"", n2(d.kbb), t.g, n2(d.era), (t.outs/3).toFixed(2), t.bf, t.ab, t.np, t.h, t.hr, t.bb, t.hbp, t.so, d.kpct!=null?(d.kpct*100).toFixed(1)+"%":"", t.wp, t.r, t.er, n2(d.whip), t.velo||"",
        t.rk_out, t.rk_gb, t.rk_fb, t.rk_bb, t.rk_hr, rk.total, rk.core!=null?(rk.core*100).toFixed(1)+"%":""]);
    });
  }
  if(!lines.length){ toast("この期間に書き出す記録がありません"); return; }
  const csv = [head].concat(lines).map(r=>r.map(c=>{
    const s = String(c==null?"":c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\n");
  offer(csv, `${side==="bat"?"打者":"投手"}成績_${(ui.period==="custom"? (ui.from||"")+"_"+(ui.to||"") : ui.period)}.csv`, "text/csv");
}
const n3 = v => (v==null||!isFinite(v)) ? "" : v.toFixed(3);
const n2 = v => (v==null||!isFinite(v)) ? "" : v.toFixed(2);
function offer(content, filename, mime){
  const blob = new Blob(["\uFEFF"+content], {type:mime+";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const box = document.getElementById("outBox");
  box.innerHTML = `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">

    <a class="btn block" href="${url}" download="${esc(filename)}">ダウンロード</a>

    <textarea readonly style="margin-top:8px">${esc(content)}</textarea></details></div>`;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

document.addEventListener("click", e=>{
  const nav = e.target.closest("nav button");
  if(nav){ ui.tab = nav.dataset.tab; ui.gameId = null; render(); return; }

  const step = e.target.closest("[data-step]");
  if(step && sheetState){
    const k = step.dataset.k, delta = +step.dataset.step;
    if(k === "__ip"){
      const whole = Math.max(0, Math.floor(sheetState.v.outs/3) + delta);
      sheetState.v.outs = whole*3 + sheetState.v.outs%3;
    }else{
      sheetState.v[k] = Math.max(0, (+sheetState.v[k]||0) + delta);
    }
    sheetState.type === "bat" ? drawBatSheet() : drawPitSheet();
    return;
  }

  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  try{ handleAction(act, id, v, b); }
  catch(err){ showError(act + " → " + (err && err.message || err)); }
});
function handleAction(act, id, v, b){
  const WRITES = ["newGame","editGame","createGame","updateGame","delGame","editBat","editPit","saveEntry","delEntry",
                  "newPlayer","editPlayer","savePlayer","delPlayer","impPreview","impRun","wipe","riskFill"];
  if(WRITES.indexOf(act) >= 0 && !canEdit()){ toast("閲覧モードです。更新はデータ班の端末から行われます"); return; }

  switch(act){
    case "set": ui[b.dataset.g] = v; render(); break;
    case "sort": ui.sort = v; render(true); break;
    case "toggleTable": ui.table = !ui.table; render(); break;
    case "pmode": ui.pmode = v; render(); break;
    case "riskFill": {
      sheetState.v.rk_bb = (+sheetState.v.bb||0) + (+sheetState.v.hbp||0);
      sheetState.v.rk_hr = (+sheetState.v.hr||0);
      drawPitSheet(); break;
    }
    case "player": ui.playerId = id; ui.pside = ui.side; ui.tab = "player"; render(); break;
    case "pickPlayer": ui.playerId = id; ui.tab = "player"; render(); break;
    case "backPicker": ui.playerId = null; render(); break;
    case "pside": ui.pside = v; render(); break;
    case "gteam": ui.gteam = v; b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); break;

    case "newGame": gameForm(null); break;
    case "openGame": ui.gameId = id; render(); break;
    case "backGames": ui.gameId = null; render(); break;
    case "editGame": gameForm(S.games.find(g=>g.id===ui.gameId)); break;
    case "createGame": {
      const g = {id:uid(), date:val("gDate"), opponent:val("gOpp"), venue:val("gVen"), team:ui.gteam,
                 rs: val("gRs")==="" ? "" : +val("gRs"), ra: val("gRa")==="" ? "" : +val("gRa")};
      if(!g.date){ toast("日付を入れてください"); break; }
      S.games.push(g); persist(); closeSheet(); ui.gameId = g.id; render(); break;
    }
    case "updateGame": {
      const g = S.games.find(x=>x.id===ui.gameId);
      g.date = val("gDate"); g.opponent = val("gOpp"); g.venue = val("gVen"); g.team = ui.gteam;
      g.rs = val("gRs")==="" ? "" : +val("gRs"); g.ra = val("gRa")==="" ? "" : +val("gRa");
      persist(); closeSheet(); render(); toast("保存しました"); break;
    }
    case "delGame": {
      if(!confirm("この試合と、入力済みの成績をまとめて削除します。よろしいですか？")) break;
      S.games = S.games.filter(g=>g.id!==ui.gameId);
      delete S.bat[ui.gameId]; delete S.pit[ui.gameId];
      ui.gameId = null; persist(); render(); toast("削除しました"); break;
    }
    case "editBat": openBatSheet(ui.gameId, id); break;
    case "editPit": openPitSheet(ui.gameId, id); break;
    case "outs": {
      sheetState.v.outs = Math.floor(sheetState.v.outs/3)*3 + (+v);
      drawPitSheet(); break;
    }
    case "saveEntry": saveEntry(); break;
    case "delEntry": delEntry(); break;

    case "newPlayer": playerForm(null); break;
    case "editPlayer": playerForm(S.players.find(p=>p.id===id)); break;
    case "pgrade": {
      formState.grade = v;
      b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      break;
    }
    case "tog": {
      const k = b.dataset.k; formState[k] = !formState[k]; b.classList.toggle("on", formState[k]);
      if(!formState.bats && !formState.pitches){ formState[k] = true; b.classList.add("on"); toast("打者・投手のどちらかは必要です"); }
      break;
    }
    case "savePlayer": {
      const name = val("pName").trim();
      if(!name){ toast("名前を入れてください"); break; }
      const data = {grade:formState.grade, name, bats:formState.bats, pitches:formState.pitches, active:formState.active};
      if(editingPlayer) Object.assign(editingPlayer, data);
      else S.players.push(Object.assign({id:uid()}, data));
      persist(); closeSheet(); render(); toast("保存しました"); break;
    }
    case "delPlayer": {
      const used = S.games.some(g => (S.bat[g.id]||{})[editingPlayer.id] || (S.pit[g.id]||{})[editingPlayer.id]);
      if(used && !confirm("この選手の成績も一緒に消えます。残す場合は「入力画面に表示する」をオフにしてください。削除しますか？")) break;
      S.players = S.players.filter(p=>p.id!==editingPlayer.id);
      Object.values(S.bat).forEach(o=>delete o[editingPlayer.id]);
      Object.values(S.pit).forEach(o=>delete o[editingPlayer.id]);
      persist(); closeSheet(); render(); toast("削除しました"); break;
    }

    case "goImport": case "goEdit": ui.tab = "edit"; render(); break;

    case "impSide": impSide = v; renderEdit(); break;
    case "impPreview": importPreview(); break;
    case "impRun": runImport(); break;
    case "closeSheet": closeSheet(); break;
    case "connSave": {
      const was = {owner:conn.owner, repo:conn.repo, path:conn.path, pass:conn.pass};
      conn.owner = valOr("cOwner", conn.owner); conn.repo = valOr("cRepo", conn.repo);
      conn.branch = valOr("cBranch", conn.branch) || "main"; conn.path = valOr("cPath", conn.path) || "data.json";
      conn.token = valOr("cToken", conn.token); conn.pass = valOr("cPass", conn.pass);
      const newKey = valOr("cEditKey", "");
      saveConn(); setSync(canSync()? "dirty" : "off");
      if(newKey){
        sha256hex(newKey).then(hx=>{
          S.editKeyHash = hx; conn.editOK = true; saveConn(); persist(); render();
          toast("編集用パスキーを設定しました");
        });
      }
      render(); toast("接続を保存しました");
      const moved = was.owner !== conn.owner || was.repo !== conn.repo || was.path !== conn.path;
      const passChanged = was.pass !== conn.pass;
      /* 保存先を変えた／合言葉を変えた場合は、この端末の内容を書き出す */
      if(conn.token && (moved || passChanged)) push(true);
      else if(canSync()) pull({toast:true, force:true});
      break;
    }
    case "editUnlock": {
      const pw = val("editKey");
      if(!pw){ toast("パスキーを入れてください"); break; }
      sha256hex(pw).then(hx=>{
        if(hx === S.editKeyHash){ conn.editOK = true; saveConn(); editMsg = ""; render(); toast("編集モードになりました"); }
        else { editMsg = "パスキーが違います。"; render(); }
      });
      break;
    }
    case "resetEditKey": {
      const pw = val("rkPass"), nk = val("rkNew");
      if(!conn.token){ toast("編集用トークンが必要です"); break; }
      if(!pw || !nk){ toast("両方を入力してください"); break; }
      if(pw !== conn.pass){ editMsg = "閲覧合言葉が違います。"; render(); break; }
      sha256hex(nk).then(hx=>{
        S.editKeyHash = hx; conn.editOK = true; editMsg = "";
        persist(); render(); toast("パスキーを再設定しました");
      });
      break;
    }
    case "clearEditKey": {
      if(!confirm("編集用パスキーを解除します。トークンを入れた端末なら誰でも編集できる状態に戻ります。よろしいですか？")) break;
      delete S.editKeyHash; conn.editOK = true; saveConn(); persist(); render(); toast("解除しました");
      break;
    }
    case "unlock": {
      const pw = val("lockPass");
      if(!pw){ toast("合言葉を入れてください"); break; }
      conn.pass = pw; lockMsg = "";
      (async ()=>{
        if(lastRaw){
          try{
            S = normalize(await decodePayload(lastRaw));
            locked = false; sync.base = S.updatedAt || 0; render();
          }catch(e){ render(); return; }      /* 合言葉が違う */
        }
        await pull({silent:true});            /* 通信できれば最新に更新 */
        render();
      })();
      break;
    }
    case "peek": {
      const el = document.getElementById(v);
      if(!el) break;
      const show = el.type === "password";
      el.type = show ? "text" : "password";
      b.textContent = show ? "隠す" : "表示";
      b.classList.toggle("on", show);
      break;
    }
    case "pullNow": pull({toast:true, force:true}); break;
    case "pushNow": push(); break;
    case "expCsv": exportCsv(v); break;
    case "expJson": offer(JSON.stringify(S,null,1), "scorebook_backup_"+new Date().toISOString().slice(0,10)+".json", "application/json"); break;
    case "wipe": {
      if(!confirm("選手・試合・成績をすべて消去します。元に戻せません。よろしいですか？")) break;
      S = {players:[], games:[], bat:{}, pit:{}}; persist(); render(); toast("消去しました"); break;
    }
  }
}
const SEARCH_BOXES = {qb:"details", qp:"details", qedit:"#editList", qsel:"#pickList"};
function runSearch(input){
  const scope = SEARCH_BOXES[input.id];
  const box = scope === "details" ? input.closest("details") : document.querySelector(scope);
  if(!box) return;
  const q = input.value.toLowerCase().replace(/[\s　]/g,"");
  let hit = 0;
  box.querySelectorAll("[data-name]").forEach(el=>{
    const on = !q || el.dataset.name.indexOf(q) >= 0;
    el.style.display = on ? "" : "none";
    if(on) hit++;
  });
  const none = box.querySelector("[data-none]");
  if(none) none.style.display = hit ? "none" : "";
}
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id && SEARCH_BOXES[t.id]){ runSearch(t); return; }
  if(t.dataset && t.dataset.k && sheetState){
    const k = t.dataset.k, n = Math.max(0, Math.round(+t.value||0));
    if(k === "__ip") sheetState.v.outs = n*3 + sheetState.v.outs%3;
    else sheetState.v[k] = n;
  }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.id === "fromD"){ ui.from = t.value; renderStats(); return; }
  if(t.id === "toD"){ ui.to = t.value; renderStats(); return; }
  if(t.dataset && t.dataset.k && sheetState){
    sheetState.type === "bat" ? drawBatSheet() : drawPitSheet();
  }
});
function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }
function valOr(id, cur){ const el = document.getElementById(id); return el ? el.value.trim() : cur; }

/* ============================================================
   起動
   ============================================================ */
document.getElementById("syncBtn").addEventListener("click", ()=>{
  if(!canSync()){ ui.tab = "edit"; render(); return; }
  pull({toast:true});
});
window.addEventListener("online", ()=>{
  if(conn.token && sync.state !== "ok") push();
});
document.addEventListener("visibilitychange", async ()=>{
  if(document.hidden || !canSync() || conn.token) return;
  const before = S.updatedAt || 0;
  await pull({silent:true, force:true});
  if((S.updatedAt||0) !== before){ render(); toast("最新に更新しました"); }
});

(async function(){
  const cached = await store.load();
  loadConn();
  if(!canSync()){
    S = normalize(cached || {});
    sync.base = S.updatedAt || 0;
    setSync("off"); render(); return;
  }
  setSync("sync");
  if(cached){
    lastRaw = cached;
    try{
      S = normalize(await decodePayload(cached));   /* 圏外でもここまでは動く */
      sync.base = S.updatedAt || 0; locked = false;
    }catch(e){ /* 合言葉待ち */ }
    render();
  }else{
    view.innerHTML = `<div class="card"><div class="empty">読み込んでいます…</div></div>`;
  }
  await pull({});
  if(!locked) render();
  if(!lastRaw && !S.games.length){
    view.innerHTML = `<div class="card"><div class="empty"><strong>読み込めませんでした</strong>
      通信できる場所で一度開くと、以降は圏外でも直前の内容を見られるようになります。</div></div>`;
  }
})();
</script>
